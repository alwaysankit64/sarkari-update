<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>भर्ती विवरण | सरकारी अपडेट</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="top">सरकारी अपडेट</div><div class="head"><a class="logo" href="index.html">सरकारी अपडेट</a><span>Recruitment Details</span></div></header>
<main class="wrap"><a class="back" href="index.html">← वापस Latest Jobs पर जाएँ</a><div id="detail"></div></main>
<footer>© सरकारी अपडेट — आवेदन से पहले Official Notification पढ़ें।</footer>
<script src="data.js"></script>
<script>
const id=new URLSearchParams(location.search).get("id"); const j=jobs.find(x=>x.id===id);
if(!j){document.getElementById("detail").innerHTML='<div class="empty">भर्ती नहीं मिली। <a href="index.html">होम पर जाएँ</a></div>';}
else{
document.title=j.title+" | सरकारी अपडेट";
document.getElementById("detail").innerHTML=`
<h1>${j.title}</h1><div class="status">${j.status}</div>
<div class="detail"><div><b>संस्था</b><span>${j.org}</span></div><div><b>कुल पद</b><span>${j.posts}</span></div><div><b>आवेदन शुरू</b><span>${j.startDate}</span></div><div><b>अंतिम तारीख</b><span>${j.lastDate}</span></div><div><b>योग्यता</b><span>${j.qualification}</span></div><div><b>आयु सीमा</b><span>${j.age}</span></div><div><b>आवेदन शुल्क</b><span>${j.fee}</span></div><div><b>चयन प्रक्रिया</b><span>${j.selection}</span></div><div><b>वेतन</b><span>${j.salary}</span></div><div><b>श्रेणी</b><span>${j.category}</span></div></div>
<div class="links"><a class="red" target="_blank" href="${j.apply}">Apply Online</a><a class="dark" target="_blank" href="${j.notification}">Official Notification</a><a class="outline" target="_blank" href="${j.official}">Official Website</a></div>
<div class="important"><b>महत्वपूर्ण निर्देश</b><br>ऊपर दी गई सामान्य जानकारी के साथ Official Notification में दी गई post-wise eligibility, category-wise vacancy, fee, dates, documents और अन्य शर्तें जरूर पढ़ें।</div>`;
}
</script></body></html>
